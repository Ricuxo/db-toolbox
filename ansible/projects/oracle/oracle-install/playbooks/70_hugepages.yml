---
# Fase 70 — HugePages para o SGA e USE_LARGE_PAGES. Precisa das fases 60 e 65.
# ATENÇÃO: reinicia o banco (srvctl) quando há mudança. Em servidor em uso, só em janela.
- name: Oracle Database — HugePages
  hosts: "{{ ora_hosts | default('oracle:!oracle_rac') }}"   # rac_asm: fase ainda não implementada
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Guarda de ambiente
      ansible.builtin.import_role:
        name: ora_env
      tags: [always]                # roda mesmo com --tags/--skip-tags
      vars:
        ora_env_confirm: true       # reinicia o banco: em prod exige -e ora_confirm_env=prod
  roles:
    - role: ora_hugepages
      tags: [hugepages]
