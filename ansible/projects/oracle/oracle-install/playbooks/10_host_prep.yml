---
# Fase 10 — preparação do host (preinstall + o que ele não cobre).
# Depois desta fase: rodar a validação de confirmação dos pré-requisitos de SO.
- name: Preparação do host
  hosts: "{{ ora_hosts | default('oracle') }}"
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Guarda de ambiente
      ansible.builtin.import_role:
        name: ora_env
      tags: [always]                # roda mesmo com --tags/--skip-tags
      vars:
        ora_env_phase_types: [restart_asm, si_fs, rac_asm]
  roles:
    - role: ora_host_prep
      tags: [host_prep]
