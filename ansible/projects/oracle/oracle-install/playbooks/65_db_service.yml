---
# Fase 65 — serviços do Oracle Restart para as PDBs (idempotente). Precisa da fase 60.
- name: Oracle Database — serviços das PDBs
  hosts: "{{ ora_hosts | default('oracle_restart') }}"
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Guarda de ambiente
      ansible.builtin.import_role:
        name: ora_env
      tags: [always]                # roda mesmo com --tags/--skip-tags
  roles:
    - role: ora_db_service
      tags: [db_service]
