---
# Fase 60 — criação do banco (CDB + PDB) com dbca. Precisa das fases 10–50 e de
# vault_ora_sys_password / vault_ora_system_password / vault_ora_pdbadmin_password (vault.yml).
- name: Oracle Database — criação do banco
  hosts: "{{ ora_hosts | default('oracle_restart') }}"
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Guarda de ambiente
      ansible.builtin.import_role:
        name: ora_env
      tags: [always]                # roda mesmo com --tags/--skip-tags
  roles:
    - role: ora_dbca
      tags: [dbca]
