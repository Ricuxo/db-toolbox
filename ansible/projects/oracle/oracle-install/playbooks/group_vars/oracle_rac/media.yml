---
# RU e catálogo da instalação do cenário rac_asm. Vence o playbooks/group_vars/all/media.yml (19.32)
# para os hosts do grupo oracle_rac. O ora_media é substituído inteiro: o catálogo tem de ser completo.
#
# 19.30 com RHCK: o guia 19c só suporta UEK 8 a partir da 19.32; da 19.19 em diante, OL9 com RHCK
# 5.14.0-70.22.1 ou mais novo ("Supported Oracle Linux 9 Distributions for x86-64").
ora_ru: 19.30.0.0

# A fase 20 identifica cada item pelo nome do arquivo, sem checksum (decisão do DBA, como a oravirt).
# OPatch: o README da GIRU 19.30 exige "12.2.0.1.48 or later" e recomenda o mais recente.
ora_media:
  grid_base: {file: LINUX.X64_193000_grid_home.zip}
  db_base:   {file: LINUX.X64_193000_db_home.zip}
  opatch:    {file: p6880880_190000_Linux-x86-64.zip}   # OPatch 12.2.0.1.55
  ru_grid:   {file: p38629535_190000_Linux-x86-64.zip, patchid: "38629535"}  # GI RELEASE UPDATE 19.30.0.0.0 (REL-JAN260130)
  # One-offs: não há página "Installing Oracle Database 19c (19.30) on Oracle Linux 9" (só a da 19.32).
  # 38609069 (ASMCMD-8307: COULD NOT SIGN THE GPNP PROFILE): overlay da 19.30 para o Grid home e o DB
  # home, RAC rolling; entra para o teste de rollback (decisão do DBA, 2026-11-24).
  oneoffs:
    - {file: p38609069_1930000DBRU_Generic.zip, patchid: "38609069"}
