# RU alvo e catálogo da mídia da INSTALAÇÃO (projeto oracle-install), iguais para todo ambiente:
# o sha256 do MOS é o mesmo em qualquer lugar. Trocar de RU = trocar este arquivo.
# Precedência: um group_vars/<grupo> ou host_vars do inventário vence este arquivo.
# ora_version (release instalado no servidor) fica no inventário: group_vars/oracle/main.yml.

ora_ru: 19.32.0.0          # obrigatório: OL9 com UEK 8 só é suportado a partir do 19.32 (guia 19c)

# Catálogo da mídia que o DBA coloca em ora_stage_dir.
# sha256: copiar do My Oracle Support (detalhes do download). Sem sha256 o stage falha.
# sha256 conferidos pelo DBA em 2026-11-13: OPatch e RUs com o MOS; bases 19.3 com o
# Oracle Software Delivery Cloud.
