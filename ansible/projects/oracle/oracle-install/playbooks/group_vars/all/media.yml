---
# Catálogo da mídia da INSTALAÇÃO (projeto oracle-install), um por RU, igual para todo ambiente.
# A RU de cada servidor é o ora_ru: o padrão está aqui, e o inventário escolhe outra por servidor
# (host_vars/<host>.yml) ou por cluster/grupo (group_vars/<grupo>/main.yml), que vencem este arquivo.
# O ora_media é o catálogo da RU escolhida. RU nova = uma entrada nova em ora_media_catalog.
# ora_version (release da mídia base) fica no inventário: group_vars/oracle/main.yml.
#
# Suporte de SO por RU (guia 19c, "Supported Oracle Linux <8|9|10> Distributions for x86-64",
# conferido pela matriz ora_supported_os): OL9 com UEK 8 e OL10 só a partir da 19.32; OL9 com UEK 7
# ou RHCK 5.14.0-70.22.1+ a partir da 19.19; OL8.8 com UEK 7 a partir da 19.23.
#
# A fase 20 identifica cada item pelo nome do arquivo, sem checksum (decisão do DBA, como a oravirt).
# Chaves por cenário (fase 20): restart_asm grid_base, db_base, opatch, ru_grid, ru_db, asmlib;
# si_fs db_base, opatch, ru_db; rac_asm grid_base, db_base, opatch, ru_grid. oneoffs é opcional.

ora_ru: 19.32.0.0

ora_media: "{{ ora_media_catalog[ora_ru] | default({}) }}"

ora_media_catalog:
  "19.32.0.0":
    grid_base: {file: LINUX.X64_193000_grid_home.zip}
    db_base:   {file: LINUX.X64_193000_db_home.zip}
    opatch:    {file: p6880880_190000_Linux-x86-64.zip}
    ru_grid:   {file: p39467003_190000_Linux-x86-64.zip, patchid: "39467003"}  # GI RELEASE UPDATE 19.32.0.0.0
    ru_db:     {file: p39472050_190000_Linux-x86-64.zip, patchid: "39472050"}  # DATABASE RELEASE UPDATE 19.32.0.0.0
    # One-offs exigidos no comando do gridSetup/runInstaller da página oficial "Installing Oracle
    # Database 19c (19.32) on Oracle Linux 9 and RHEL 9".
    # A lista muda por cenário (ora_install_type, do grupo do inventário): o 39932578 só entra em si_fs.
    oneoffs: "{{ (_ora_oneoff_39932578 if ora_install_type == 'si_fs' else []) + _ora_oneoffs_common }}"
    # ASMLib v3 por major do Oracle Linux (páginas linux-asmlib-v<8|9|10>-downloads da Oracle); a
    # fase 30 confere a assinatura (rpm -K). O oracleasm-support vem do ol<major>_addons
    # (gpgcheck=1), sem catálogo.
    asmlib:
      "8":  {file: oracleasmlib-3.1.3.-1.el8.x86_64.rpm}
      "9":  {file: oracleasmlib-3.1.3-1.el9.x86_64.rpm}
      "10": {file: oracleasmlib-3.1.1-1.el10.x86_64.rpm}
    # CVU avulso (MOS 30839369, 23.26.3). NÃO usado na 19c em OL9: não tem dados de
    # referência de 19c para OL9 (usa os do OL7). Mapeado para quando o alvo for 26ai.
    # cvu: {file: p30839369_2326000_Linux-x86-64.zip}

  # 19.33 (GIRU de outubro de 2026, CPU out/2026). Não há página "Installing Oracle Database 19c
  # (19.33)" (a última é a da 19.32): sem one-offs por ora — NÃO VERIFICADO, decisão do DBA.
  # OPatch: o README da GIRU 19.33 exige 12.2.0.1.52 ou mais novo. Sem ru_db nem asmlib: hoje só o rac_asm.
  "19.33.0.0":
    grid_base: {file: LINUX.X64_193000_grid_home.zip}
    db_base:   {file: LINUX.X64_193000_db_home.zip}
    opatch:    {file: p6880880_190000_Linux-x86-64.zip}
    ru_grid:   {file: p39922757_190000_Linux-x86-64.zip, patchid: "39922757"}  # GI RELEASE UPDATE 19.33.0.0.0 (REL-OCT261020)

  # 19.30 (GIRU de janeiro de 2026). Não há página "Installing Oracle Database 19c (19.30) on Oracle
  # Linux 9" (só a da 19.32): os one-offs são decisão do DBA. OPatch: o README da GIRU 19.30 exige
  # "12.2.0.1.48 or later" e recomenda o mais recente. Sem ru_db nem asmlib: hoje só o rac_asm.
  "19.30.0.0":
    grid_base: {file: LINUX.X64_193000_grid_home.zip}
    db_base:   {file: LINUX.X64_193000_db_home.zip}
    opatch:    {file: p6880880_190000_Linux-x86-64.zip}
    ru_grid:   {file: p38629535_190000_Linux-x86-64.zip, patchid: "38629535"}  # GI RELEASE UPDATE 19.30.0.0.0 (REL-JAN260130)
    oneoffs:
      # ASMCMD-8307: COULD NOT SIGN THE GPNP PROFILE. Overlay da 19.30 para o Grid home e o DB home,
      # RAC rolling; entra para o teste de rollback (decisão do DBA, 2026-11-24).
      - {file: p38609069_1930000DBRU_Generic.zip, patchid: "38609069"}

# Mapeado para quando houver a entrada 19.33 (NÃO usar com 19.32). 39932578 sem variante 19.33 até 2026-11-13.
#   - {file: p39544247_1933000DBRU_Linux-x86-64.zip, patchid: "39544247"}
#   - {file: p39388682_1933000DBRU_Generic.zip,      patchid: "39388682"}

# 39932578 (MERGE ON OCW RU 19.32.0.0.0 OF 36365489 36429384 37409807 38872548 39729560).
# - restart_asm: FORA (decisão do DBA, 2026-11-16). A GIRU já traz o OCW: o sub-patch 39526364 tem os
#   mesmos 161 arquivos de CVU (files/cv, jlib/cvu*) do 39932578, e duas instalações do zero passaram
#   sem ele.
# - si_fs: DENTRO (decisão do DBA, 2026-11-17). A DB RU 39472050 não traz nenhum arquivo de CVU; sem o
#   39932578 o runInstaller -applyRU cai em supportedOSCheck (INS-08101, NullPointerException em
#   StorageUtil, CVU de 2019 no home). A página da 19.32 o lista no comando do Single Instance.
_ora_oneoff_39932578:
  - {file: p39932578_1932000OCWRU_Linux-x86-64.zip, patchid: "39932578"}

# One-offs exigidos no comando do gridSetup/runInstaller da página oficial "Installing Oracle
# Database 19c (19.32) on Oracle Linux 9 and RHEL 9".
_ora_oneoffs_common:
  - {file: p39544247_1932000DBRU_Linux-x86-64.zip,  patchid: "39544247"}  # LNX-OL9-19RU-ZIP: REMOTE ROOT.SH POSTPATCH FAILS ... ORA-00600 [KFNSBACKGROUND11]
  - {file: p39388682_1932000DBRU_Generic.zip,       patchid: "39388682"}  # PL19.31SHIPTEST OL10 :OCCI DEMOS ARE FAILING DURING COMPILATION
