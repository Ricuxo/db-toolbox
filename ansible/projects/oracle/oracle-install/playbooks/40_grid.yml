---
# Fase 40 — Grid Infrastructure for a Standalone Server (Oracle Restart). Precisa das fases 10–30
# e de vault_ora_sysasm_password / vault_ora_asmsnmp_password (group_vars/all/vault.yml).
- name: Oracle Grid Infrastructure (Restart)
  hosts: "{{ ora_hosts | default('oracle_restart') }}"
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Guarda de ambiente
      ansible.builtin.import_role:
        name: ora_env
      tags: [always]                # roda mesmo com --tags/--skip-tags
  roles:
    - role: ora_grid
      tags: [grid]
