---
# Guarda de ambiente: roda antes de tudo em cada playbook. Só leitura.

- name: Ambiente | ora_env definido no inventário
  ansible.builtin.assert:
    that:
      - ora_env is defined
      - ora_env in ora_env_allowed
    fail_msg: >-
      ora_env {{ ('= "' ~ ora_env ~ '" não está em ' ~ ora_env_allowed) if ora_env is defined
      else 'não definido' }}. Ele vem de inventories/<amb>/group_vars/all/main.yml: confira o -i.
    quiet: true

# O ambiente é dito num lugar só: o diretório do -i. Pega o "-e ora_env=..." que mascara o
# inventário e o inventories/prod copiado do lab sem trocar o ora_env.
- name: Ambiente | ora_env igual ao diretório do inventário
  ansible.builtin.assert:
    that: ora_env == (inventory_dir | basename)
    fail_msg: >-
      ora_env={{ ora_env }}, mas o inventário deste host é {{ inventory_dir }}. O ambiente vem do
      -i: não passe ora_env por -e, e confira o ora_env em group_vars/all/main.yml.
    quiet: true

- name: Ambiente | Cenário do host (grupo do inventário)
  ansible.builtin.assert:
    that:
      - ora_install_type is defined
      - ora_install_type in ora_install_types
    fail_msg: >-
      ora_install_type {{ ('= "' ~ ora_install_type ~ '" não está em ' ~ ora_install_types)
      if ora_install_type is defined else 'não definido' }}. Ele vem do grupo do host no inventário
      (oracle_restart, oracle_si ou oracle_rac, em group_vars/<grupo>/main.yml).
    quiet: true

- name: Ambiente | Cenário tratado por esta fase
  ansible.builtin.assert:
    that: ora_install_type in ora_env_phase_types
    fail_msg: >-
      Esta fase ainda não trata o cenário {{ ora_install_type }} (trata {{ ora_env_phase_types }}).
      Nada foi alterado.
    quiet: true

- name: Ambiente | Variáveis do cenário si_fs (group_vars/oracle_si)
  ansible.builtin.assert:
    that:
      - ora_db_data_mount is defined
      - ora_db_data_dir is defined
      - ora_db_fra_dir is defined
    fail_msg: >-
      Cenário si_fs sem ora_db_data_mount, ora_db_data_dir ou ora_db_fra_dir. Eles vêm de
      group_vars/oracle_si/main.yml: o host está no grupo oracle_si do inventário?
    quiet: true
  when: ora_install_type == 'si_fs'

- name: Ambiente | Alvo desta execução
  ansible.builtin.debug:
    msg: "Ambiente {{ ora_env | upper }} — {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }}) — cenário {{ ora_install_type }}"

- name: Ambiente | Confirmação para alterar banco existente em produção
  ansible.builtin.assert:
    that: ora_confirm_env | default('') == ora_env
    fail_msg: >-
      Este playbook para ou altera um banco que já existe, e o ambiente é {{ ora_env | upper }}.
      Para seguir, repita o ambiente na linha de comando: -e ora_confirm_env={{ ora_env }}
    quiet: true
  when: ora_env_confirm | bool and ora_env == 'prod'
