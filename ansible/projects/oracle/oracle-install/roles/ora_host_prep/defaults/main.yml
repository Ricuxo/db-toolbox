---
# RPM preinstall por release (o nome vem da documentação/repositório da versão).
ora_host_prep_preinstall_rpm:
  "19": oracle-database-preinstall-19c

# Pacotes exigidos pelo guia 19c, por release do Oracle e major do Oracle Linux (x86-64). O
# preinstall não puxa todos, por isso a lista é instalada explicitamente.
# Fontes: Database Installation Guide 19c for Linux — "Supported Oracle Linux <8|9|10>
# Distributions for x86-64" (prefixo ladbi, abaixo).
ora_host_prep_packages:
  "19":
    "8":
      - bc
      - binutils
      - compat-openssl10
      - elfutils-libelf
      - elfutils-libelf-devel
      - fontconfig
      - glibc
      - glibc-devel
      - ksh
      - libaio
      - libaio-devel
      - libXrender
      - libX11
      - libXau
      - libXi
      - libXtst
      - libgcc
      - libnsl
      - librdmacm
      - libstdc++
      - libstdc++-devel
      - libxcb
      - libibverbs
      - libasan
      - liblsan
      - make
      - policycoreutils
      - policycoreutils-python-utils
      - rng-tools
      - smartmontools
      - sysstat
    "9":
      - bc
      - binutils
      - compat-openssl11
      - elfutils-libelf
      - fontconfig
      - glibc
      - glibc-devel
      - ksh
      - libaio
      - libX11
      - libXau
      - libXi
      - libXrender
      - libXtst
      - libxcrypt-compat
      - libgcc
      - libibverbs
      - libnsl
      - libstdc++
      - libxcb
      - libvirt-libs
      - make
      - policycoreutils
      - policycoreutils-python-utils
      - smartmontools
      - sysstat
      - xz-devel
    "10":
      - bc
      - binutils
      - elfutils-libelf
      - fontconfig
      - glibc
      - glibc-devel
      - ksh
      - libaio
      - libgcc
      - libibverbs
      - libstdc++
      - libvirt-libs
      - libxcb
      - libX11
      - libXau
      - libXi
      - libXrender
      - libXtst
      - libxcrypt-compat
      - make
      - policycoreutils
      - policycoreutils-python-utils
      - smartmontools
      - sysstat
      - xz-devel

# Grupos de ASM, só em servidor com ASM (ora_asm definido). Nomes e GIDs da documentação 19c.
# O template oficial gridsetup.rsp exige OSASM diferente do OSDBA; o dono único entra nos três.
# Fonte: Creating Operating System Privileges Groups (19c)
# https://docs.oracle.com/en/database/oracle/oracle-database/19/ladbi/configuring-users-groups-and-environments-for-oracle-grid-infrastructure-and-oracle-database/creating-operating-system-privileges-groups.html
ora_host_prep_asm_groups:
  - {name: asmadmin, gid: 54329}   # OSASM
  - {name: asmdba,   gid: 54327}   # OSDBA for ASM (dono dos discos ASM)
  - {name: asmoper,  gid: 54328}   # OSOPER for ASM

# Parâmetros exigidos pela checagem integrada do gridSetup 19.32 (CVU atualizado pela RU) que não
# estão na tabela de mínimos do guia nem são gravados pelo preinstall. Arquivo próprio, sem tocar
# no do preinstall. Fonte: PRVG-1205 no gridSetupActions (laboratório, 2026-11-14).
ora_host_prep_sysctl_file: /etc/sysctl.d/98-oracle-install.conf
ora_host_prep_sysctl_extra:
  kernel.panic: 1
