---
argument_specs:
  verify:
    short_description: Confere se a mídia do catálogo está no stage, pelo nome do arquivo (só leitura).
    options:
      ora_stage_dir: {type: path, required: true}
      ora_media:
        type: dict
        required: true
        description:
          - Catálogo da mídia. Cada item tem file; ru_grid, ru_db e os one-offs têm patchid.
          - Chaves obrigatórias por cenário - restart_asm grid_base, db_base, opatch, ru_grid, ru_db; si_fs db_base, opatch, ru_db; rac_asm grid_base, db_base, opatch, ru_grid. oneoffs é lista opcional.
  collect:
    short_description: Move para o stage a mídia do catálogo deixada em outro diretório do servidor.
    options:
      ora_stage_dir: {type: path, required: true}
      ora_media: {type: dict, required: true}
      ora_stage_collect_from:
        type: list
        elements: path
        required: true
        description:
          - Diretórios de origem. Só move item do catálogo (pelo nome) ausente no stage e no mesmo
            filesystem do stage. Nunca sobrescreve nem apaga.
      ora_owner: {type: str, required: true}
      ora_install_group: {type: str, required: true}
  extract:
    short_description: Descompacta RU e one-offs no layout do stage (idempotente).
    options:
      ora_stage_dir: {type: path, required: true}
      ora_ru: {type: str, required: true}
      ora_owner: {type: str, required: true}
      ora_install_group: {type: str, required: true}
      ora_media: {type: dict, required: true}
