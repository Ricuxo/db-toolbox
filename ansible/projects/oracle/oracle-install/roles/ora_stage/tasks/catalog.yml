---
# Catálogo da mídia (_stage_items), obrigatoriamente completo. Incluído por verify e collect.
# A mídia é identificada pelo nome do arquivo, sem checksum (decisão do DBA, como a oravirt).

# O que cada cenário instala (rnrdm 19.32 OL9): Grid + banco em restart_asm (GIRU nos dois homes,
# ASMLib); só o banco em si_fs (DB RU, sem Grid nem ASMLib); Grid + banco RAC em rac_asm (GIRU nos
# dois homes, como no comando "Oracle RAC" da página da 19.32; discos por udev, sem ASMLib).
- name: Stage | RU com catálogo
  ansible.builtin.assert:
    that: ora_ru in ora_media_catalog
    fail_msg: >-
      ora_ru {{ ora_ru }} não está em ora_media_catalog ({{ ora_media_catalog | list }}).
      Escolha uma RU do catálogo no inventário ou acrescente a entrada em playbooks/group_vars/all/media.yml.
    quiet: true

- name: Stage | Chaves da mídia deste cenário
  ansible.builtin.set_fact:
    _stage_keys: >-
      {{ {'restart_asm': ['grid_base', 'db_base', 'opatch', 'ru_grid', 'ru_db', 'asmlib'],
          'si_fs':       ['db_base', 'opatch', 'ru_db'],
          'rac_asm':     ['grid_base', 'db_base', 'opatch', 'ru_grid']}[ora_install_type]
         | select('in', ora_media | list + ['grid_base', 'db_base', 'opatch', 'ru_grid', 'ru_db'])
         | list }}

- name: Stage | Chaves obrigatórias do catálogo
  ansible.builtin.assert:
    that: item in ora_media
    fail_msg: "ora_media sem a chave obrigatória '{{ item }}' (cenário {{ ora_install_type }})."
    quiet: true
  loop: "{{ _stage_keys }}"

- name: Stage | Montar lista de mídia esperada
  ansible.builtin.set_fact:
    _stage_items: >-
      {{ (_stage_keys | map('extract', ora_media) | list) + (ora_media.oneoffs | default([]))
       + ([ora_media.cvu] if ora_media.cvu is defined and ora_install_type == 'restart_asm' else []) }}

- name: Stage | Catálogo completo (arquivo preenchido)
  ansible.builtin.assert:
    that:
      - _stage_items | rejectattr('file', 'truthy') | list | length == 0
      - _stage_items | selectattr('patchid', 'defined') | rejectattr('patchid', 'truthy') | list | length == 0
      - ora_install_type == 'rac_asm' or ora_media.ru_db.patchid | default('') | length > 0
      - ora_install_type == 'si_fs' or ora_media.ru_grid.patchid | default('') | length > 0
    fail_msg: >-
      ora_media incompleto: todo item precisa de file, e os RUs e one-offs precisam de patchid.
    quiet: true
