---
# Fase 65 — serviços de aplicação das PDBs.
# Com Grid (restart_asm.yml, rac_asm.yml): srvctl. Fontes: 19c Administrator's Guide cap. 4 ("Configuring Automatic Restart of an Oracle Database"):
# §4.2.11 "Oracle recommends that you use SRVCTL to create and delete database services";
# §4.5.1.5.1 srvctl add service (-pdb; -policy AUTOMATIC: "automatically started upon restart of the
# database"; no RAC, -preferred <instâncias>). 19c Multitenant Guide, "Managing Services for PDBs":
# "when you use the SRVCTL utility to start a service with a PDB property for a PDB that is closed,
# the PDB is opened in read/write mode".

- name: Serviço | Ambiente do banco
  ansible.builtin.set_fact:
    # SID local: <db><nº do nó> no RAC (orcl1, orcl2…); o nome do banco nos demais cenários.
    _svc_env:
      ORACLE_HOME: "{{ ora_db_home }}"
      ORACLE_BASE: "{{ ora_base }}"
      ORACLE_SID: >-
        {{ ora_db_name ~ ((ora_rac_nodes | map(attribute='name') | list).index(inventory_hostname) + 1)
           if ora_install_type == 'rac_asm' else ora_db_name }}
    _svc_install_node: "{{ ora_install_type != 'rac_asm' or inventory_hostname == ora_rac_nodes[0].name }}"

# si_fs (si_fs.yml): sem Restart, DBMS_SERVICE e SAVE STATE. Fonte: 19c Multitenant Guide, "Managing
# Services for PDBs": "If your database is not being managed by Oracle Restart or Oracle Clusterware,
# then use the DBMS_SERVICE package"; "Preserving or Discarding the Open Mode of PDBs When the CDB
# Restarts" (ALTER PLUGGABLE DATABASE ... SAVE STATE).

- name: Serviço | Criar e subir ({{ ora_install_type }})
  ansible.builtin.include_tasks: "{{ ora_install_type }}.yml"

# ---------- Pós-checagem ----------
- name: Serviço | Rodando e PDB aberta
  ansible.builtin.command:
    argv: ["{{ ora_db_home }}/bin/sqlplus", -S, "/ as sysdba"]
    stdin: |
      set heading off feedback off pagesize 0 linesize 200
      select 'SVC='||lower(s.name)||'|'||upper(p.name)||'|'||p.open_mode
        from v$active_services s join v$pdbs p on p.con_id = s.con_id;
      exit
  environment: "{{ _svc_env }}"
  become: true
  become_user: "{{ ora_owner }}"
  register: _svc_sql
  changed_when: false
  when: not ansible_check_mode

- name: Serviço | Conferência
  ansible.builtin.assert:
    that: ('SVC=' ~ (item.name | lower) ~ '|' ~ (item.pdb | upper) ~ '|READ WRITE') in _svc_sql.stdout_lines
    fail_msg: "Serviço {{ item.name }} não está ativo com a PDB {{ item.pdb }} em READ WRITE: {{ _svc_sql.stdout_lines }}"
    quiet: true
  loop: "{{ ora_db_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Serviço | Resumo
  ansible.builtin.debug:
    msg: "{{ _svc_sql.stdout_lines }}"
  when: not ansible_check_mode
