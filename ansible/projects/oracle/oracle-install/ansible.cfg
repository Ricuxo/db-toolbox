[defaults]
# Sem inventário padrão de propósito: todo comando diz o ambiente com -i ../../../inventories/<amb>
# (inventário compartilhado em db-toolbox/ansible/inventories/).
roles_path              = roles
collections_path        = collections
host_key_checking       = True
retry_files_enabled     = False
interpreter_python      = auto_silent
callback_result_format  = yaml
callbacks_enabled       = ansible.posix.profile_tasks
# Senha do vault: informar na execução (--ask-vault-pass ou --vault-id).
# Nunca versionar arquivo de senha do vault.

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
