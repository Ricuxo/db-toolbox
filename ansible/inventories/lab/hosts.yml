---
# Inventário do ambiente LAB (ora_env: lab). Usado por todos os projetos (oracle-install e os
# próximos). Cada ambiente tem o seu diretório em inventories/<amb>/: o ambiente é o -i do comando.
all:
  vars:
    ansible_user: root
  children:
    oracle:                                # servidores Oracle (os padrões ficam em group_vars/oracle/)
      children:
        oracle_restart:                    # Oracle Restart (Grid standalone + ASM)
          hosts:
            orcl02:                        # VM orcl-02
              ansible_host: 192.168.15.151
        oracle_si:                         # Single Instance em filesystem, sem Grid
          hosts:
            orcl04:                        # VM de teste do si_fs
              ansible_host: 192.168.15.153
        oracle_rac:                        # RAC (Grid Infrastructure for a Cluster + ASM por udev)
          hosts:
            orclrac1:                      # nó de instalação (1º do grupo): a mídia fica aqui
              ansible_host: 192.168.15.170
            orclrac2:
              ansible_host: 192.168.15.171
