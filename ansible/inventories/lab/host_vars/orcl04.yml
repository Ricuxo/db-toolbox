---
# orcl04 (192.168.15.153) — laboratório do cenário si_fs. 19c Single Instance em filesystem, sem
# Grid, OL 9.8 UEK 8. 8 GB de RAM, 4 vCPU. /u01 (80 GB, software e FRA) e /u02 (60 GB, datafiles).

# Banco criado pela fase 60. CDB + 1 PDB em filesystem, archivelog, FRA em /u01.
ora_db_name: ORCL
ora_pdb_name: ORCLPDB1
ora_db_total_memory_mb: 4096      # AUTO_SGA (ASMM); metade dos 8 GB da VM
ora_db_fra_size_mb: 20480
ora_db_redo_size_mb: 512

# Serviço da aplicação (fase 65). Sem Restart: DBMS_SERVICE na PDB + SAVE STATE.
ora_db_services:
  - {name: orclpdb1_app, pdb: ORCLPDB1}
