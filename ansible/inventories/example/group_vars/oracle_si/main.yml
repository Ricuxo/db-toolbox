---
# Cenário Single Instance em filesystem, sem Grid: só o software do banco (DB RU, rnrdm 19.32 OL9),
# listener do próprio home (netca), banco subindo no boot por dbstart/dbora (unxar 19c §2.2.1).
ora_install_type: si_fs

# Layout OFA (19c ladbi, "Optimal Flexible Architecture File Path Examples"): datafiles em
# /u02/app/oracle/oradata e FRA em /u01/app/oracle/fast_recovery_area. "Creating Directories for
# Oracle Database Files": FRA de preferência em disco separado dos datafiles (decisão do DBA,
# 2026-11-16: /u02 = disco dos dados; FRA no disco do /u01).
ora_db_data_mount: /u02                       # tem de ser um ponto de montagem (disco próprio)
ora_db_data_dir: /u02/app/oracle/oradata
ora_db_fra_dir: "{{ ora_base }}/fast_recovery_area"
