---
# Inventário de exemplo: um servidor de cada cenário. Nomes e IPs fictícios.
all:
  vars:
    ansible_user: root
  children:
    oracle:
      children:
        oracle_restart:                    # Oracle Restart + ASM: um host por servidor
          hosts:
            srvrestart01:
              ansible_host: 10.0.0.10
        oracle_si:                         # Single Instance em filesystem, sem Grid
          hosts:
            srvsi01:
              ansible_host: 10.0.0.20
        oracle_rac:                        # RAC: um subgrupo por cluster
          children:
            rac_cluster01:                 # nome do cluster = group_vars/rac_cluster01/
              hosts:
                srvrac01:                  # 1º de ora_rac_nodes: nó de instalação (a mídia fica nele)
                  ansible_host: 10.0.0.31
                srvrac02:
                  ansible_host: 10.0.0.32
